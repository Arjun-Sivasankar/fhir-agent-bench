[project]
name = "fhir-agent-bench"
version = "0.1.0"
description = "A read-only MCP server over FHIR synthetic patient records, a LangGraph agent, and a benchmark of tool-call and answer accuracy across LLMs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arjun Sivasankar" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
agent = ["langgraph>=0.4", "langchain-core>=0.3"]
models = ["langchain-openai>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
fhir-mcp = "fhir_agent_bench.server:main"
fab-questions = "fhir_agent_bench.questions:main"
fab-run = "fhir_agent_bench.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fhir_agent_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = ["slow: needs network, a FHIR server or a model (skipped in CI)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S110"]
