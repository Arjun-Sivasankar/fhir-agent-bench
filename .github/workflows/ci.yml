name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          activate-environment: true  # creates and activates .venv
      - name: Install
        run: uv pip install --python .venv/bin/python -e ".[agent,dev]"
      - name: Lint
        run: |
          .venv/bin/python -m ruff check src tests
          .venv/bin/python -m ruff format --check src tests
      - name: Test (no network, no FHIR server, no model)
        run: .venv/bin/python -m pytest -m "not slow"
